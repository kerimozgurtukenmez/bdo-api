# Apache settings for BDO Craft in /srv/http/BDO-website (Arch Linux).
# Add this line at the end of /etc/httpd/conf/httpd.conf:
#   Include /srv/http/BDO-website/deploy/apache.conf
# PHP also needs the prefork MPM: in httpd.conf comment out
#   LoadModule mpm_event_module ...   and uncomment   LoadModule mpm_prefork_module ...

LoadModule rewrite_module modules/mod_rewrite.so
LoadModule php_module modules/libphp.so
AddHandler php-script .php
Include conf/extra/php_module.conf

# The project's .htaccess files decide what is served (site/ and api/public/ only)
<Directory "/srv/http/BDO-website">
    AllowOverride All
    Require all granted
    DirectoryIndex index.html index.php
</Directory>
